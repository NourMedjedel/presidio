name: French conversation sample

on:
  workflow_dispatch:
  push:
    branches: [main, feat/french-validation]
    paths:
      - .github/workflows/french-conversation.yml
      - docs/samples/python/french_conversation_phone/**
      - docs/samples/python/conversational_prompt_recognizer/**
      - presidio-analyzer/pyproject.toml
      - presidio-analyzer/uv.lock
      - presidio-anonymizer/pyproject.toml
      - presidio-anonymizer/uv.lock
      - presidio-analyzer/presidio_analyzer/**
      - presidio-anonymizer/presidio_anonymizer/**
  pull_request:
    paths:
      - .github/workflows/french-conversation.yml
      - docs/samples/python/french_conversation_phone/**
      - docs/samples/python/conversational_prompt_recognizer/**
      - presidio-analyzer/pyproject.toml
      - presidio-analyzer/uv.lock
      - presidio-anonymizer/pyproject.toml
      - presidio-anonymizer/uv.lock
      - presidio-analyzer/presidio_analyzer/**
      - presidio-anonymizer/presidio_anonymizer/**

permissions:
  contents: read

concurrency:
  group: french-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: presidio-analyzer
    env:
      PYTHONPATH: ../docs/samples/python/conversational_prompt_recognizer:../docs/samples/python/french_conversation_phone
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.6
      - name: Install locked core and development dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - name: Check sample and analyzer style
        run: >-
          uv run --locked ruff check --no-force-exclude
          ../docs/samples/python/conversational_prompt_recognizer
          ../docs/samples/python/french_conversation_phone .
      - name: Run English and French sample tests
        run: >-
          uv run --locked --with ../presidio-anonymizer --with cryptography==50.0.2
          pytest ../docs/samples/python/conversational_prompt_recognizer
          ../docs/samples/python/french_conversation_phone -q
      - name: Run model-free core phone checks
        run: >-
          uv run --locked pytest tests/test_phone_recognizer.py
          -k 'get_supported_entities or get_analysis_explanation' -q
      - name: Run nearest anonymizer checks
        run: >-
          uv run --locked --with ../presidio-anonymizer --with cryptography==50.0.2
          pytest ../presidio-anonymizer/tests/test_anonymizer_engine.py
          ../presidio-anonymizer/tests/operators/test_replace.py
          ../presidio-anonymizer/tests/operators/test_redact.py -q
